repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

      - id: ctxlint-self
        name: ctxlint (self-lint)
        # Excludes come from the repository's .ctxlint.yaml; --strict is a
        # run-behavior flag, so it isn't configurable via that file.
        entry: cargo run --quiet --bin ctxlint -- --strict .
        language: system
        always_run: true
        pass_filenames: false
